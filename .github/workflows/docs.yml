name: Publish API docs

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/docs-i18n/requirements.txt
      - uses: gradle/actions/setup-gradle@07d1f8453baaff67fb503883367f8b13e6158a54 # v6
      - run: python -m pip install -r scripts/docs-i18n/requirements.txt
      - run: ./gradlew dokkaGeneratePublicationHtml
      - name: Synchronize translation catalog with English docs
        run: >-
          python scripts/docs-i18n/docs_i18n.py sync
          --input build/dokka/html
          --catalog docs/i18n/ja/catalog.json
      - name: Validate reviewed translations
        run: >-
          python scripts/docs-i18n/docs_i18n.py validate-translations
          --catalog docs/i18n/ja/catalog.json
          --translations docs/i18n/ja/translations.json
      - name: Report translation coverage
        run: >-
          python scripts/docs-i18n/docs_i18n.py status
          --catalog docs/i18n/ja/catalog.json
          --translations docs/i18n/ja/translations.json
          --github-summary "$GITHUB_STEP_SUMMARY"
      - name: Build English and Japanese API docs
        run: >-
          python scripts/docs-i18n/docs_i18n.py build
          --input build/dokka/html
          --output build/docs-pages
          --catalog docs/i18n/ja/catalog.json
          --translations docs/i18n/ja/translations.json
          --locale ja
      - name: Verify localized API structure
        run: >-
          python scripts/docs-i18n/docs_i18n.py verify
          --english build/dokka/html
          --localized build/docs-pages/ja
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: build/docs-pages

  deploy:
    needs: build
    # The github-pages environment's protection rules reject non-default refs (e.g. v* tags),
    # so only deploy from main or a manual dispatch; tag pushes still run build for validation.
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
