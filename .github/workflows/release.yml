name: Release CLI

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@07d1f8453baaff67fb503883367f8b13e6158a54 # v6
      - run: ./gradlew :obfaryn-cli:installDist :obfaryn-cli:distTar :obfaryn-cli:distZip
      - run: python3 scripts/verify-cli-distribution.py
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            obfaryn-cli/build/distributions/obfaryn-*.tar.gz
            obfaryn-cli/build/distributions/obfaryn-*.zip
          generate_release_notes: true
