name: Verification
on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      strict_performance_gate:
        description: >-
          Fail the synthetic benchmark job on regression. Only meaningful on a dedicated/quiet
          runner; leave off for shared GitHub-hosted runners, where timing noise is large.
        type: boolean
        default: false
      max_p99_ratio:
        description: 'protected/original p99 ceiling when the gate is on (e.g. 1.8).'
        type: string
        default: '1.8'
      max_extra_bytes_per_tick:
        description: 'Extra allocated bytes/tick ceiling when the gate is on (e.g. 64).'
        type: string
        default: '64'
      fuzz_cases:
        description: >-
          Manual-only heavy fuzz run: number of FuzzDifferentialTest cases (the push/PR default,
          8, and the weekly schedule's 200 are fixed; this input is for a deliberately long,
          on-demand run).
        type: string
        default: '2000'
  schedule:
    - cron: '19 3 * * 1'
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@07d1f8453baaff67fb503883367f8b13e6158a54 # v6
      - run: ./gradlew test :obfaryn-cli:installDist
      - run: python3 scripts/verify-cli-distribution.py
      - run: python3 scripts/verify-jpms-module.py
      - run: python3 scripts/report-summary.py --self-test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: test-reports
          path: '**/build/reports/tests/'
  # A larger, seeded FuzzDifferentialTest run than push/PR's default (8 cases, already covered by
  # the `tests` job above). Weekly schedule only: this duplicates `tests`' build, so it is not
  # worth running on every push/PR, and the manual `fuzz_cases` input below is for a deliberately
  # much longer, on-demand run instead of raising this fixed weekly count.
  fuzz-testing:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@07d1f8453baaff67fb503883367f8b13e6158a54 # v6
      - name: Run FuzzDifferentialTest
        env:
          OBFARYN_FUZZ_CASES: ${{ github.event_name == 'workflow_dispatch' && inputs.fuzz_cases || '200' }}
        run: ./gradlew :obfaryn-standard:test --tests "*FuzzDifferentialTest*" --rerun
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: fuzz-failures
          path: |
            build/fuzz-failures/
            obfaryn-standard/build/reports/tests/
  # Obfaryn itself always builds with JDK 21 (see AGENTS.md); this validates only that the JARs it
  # produces still *run* correctly on other JDKs a consumer might target. Weekly and manual only --
  # it duplicates the `tests` job's build and is not informative on every push/PR.
  jdk-matrix:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: |
            8
            17
            21
            25
      - uses: gradle/actions/setup-gradle@07d1f8453baaff67fb503883367f8b13e6158a54 # v6
      - run: >
          python3 scripts/verify-jdk-matrix.py --json build/jdk-matrix/results.json
          --jdk 8=$JAVA_HOME_8_X64/bin/java
          --jdk 17=$JAVA_HOME_17_X64/bin/java
          --jdk 21=$JAVA_HOME_21_X64/bin/java
          --jdk 25=$JAVA_HOME_25_X64/bin/java
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: jdk-matrix-results
          path: build/jdk-matrix/
  public-projects:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [joml, colormath]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@07d1f8453baaff67fb503883367f8b13e6158a54 # v6
      - run: python3 scripts/compatibility/run.py --project ${{ matrix.project }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: compatibility-${{ matrix.project }}
          path: |
            build/compatibility/results.json
            build/compatibility/results-*/
  tick-benchmark:
    # Manual runs and the weekly schedule only: never on PR/push, where timing noise is useless.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@07d1f8453baaff67fb503883367f8b13e6158a54 # v6
      # Default: measure and publish machine-readable results only. The regression gate is opt-in
      # (manual dispatch with strict_performance_gate=true) because a shared runner's variance would
      # otherwise fail the job on noise rather than a real regression.
      - name: Run synthetic benchmark
        run: |
          if [ "${{ github.event_name == 'workflow_dispatch' && inputs.strict_performance_gate }}" = "true" ]; then
            python3 scripts/performance/run.py \
              --max-p99-ratio "${{ inputs.max_p99_ratio }}" \
              --max-extra-bytes-per-tick "${{ inputs.max_extra_bytes_per_tick }}"
          else
            python3 scripts/performance/run.py
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: synthetic-tick-performance
          path: build/performance/
  vm-benchmark:
    # Interpreter dispatch/invocation cost of a virtualized method vs. the original. Manual and
    # weekly only; dispatch ratios are large and host-sensitive, so results are published without a
    # CI gate -- fixed-host gating is available locally via virtualization.py --max-p99-ratio.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@07d1f8453baaff67fb503883367f8b13e6158a54 # v6
      - run: python3 scripts/performance/virtualization.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: virtualization-dispatch-performance
          path: build/performance-vm/
