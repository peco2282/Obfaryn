# Dependabot version + security updates.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Note on the Java 8 target: library and CLI modules compile with `--release 8`, but that constrains
# the *bytecode* target, not dependency versions — ASM, picocli and Kotlin stdlib all still run on
# Java 8, so keep taking these updates. Decline only a specific update that drops Java 8 support
# (the gradle-plugin module targets Java 17 and is free of that constraint).
version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      asm:
        patterns:
          - "org.ow2.asm:*"
      kotlin:
        patterns:
          - "org.jetbrains.kotlin:*"
          - "org.jetbrains.kotlinx:*"
      junit:
        patterns:
          - "org.junit*:*"
    ignore:
      # JUnit 6 requires Java 17; library and CLI test classpaths must remain Java 8 compatible.
      - dependency-name: "org.junit:junit-bom"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
